<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>POS Laundry Premium</title>
    
    <!-- 1. LIBRARY EKSTERNAL (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>
<body>

    <!-- ================================================================== -->
    <!-- BAGIAN 3: HTML STRUCTURE (Biarkan di file: index.html) -->
    <!-- ================================================================== -->
    
    <div class="app-container">
        <!-- HEADER -->
        <div class="glass-header px-6 py-4 flex justify-between items-center">
            <div>
                <p class="text-xs font-semibold text-blue-500 uppercase tracking-wider">Laundry POS</p>
                <h1 class="text-xl font-bold text-slate-800">Kasir Laundry</h1>
            </div>
            <div class="flex gap-2">
                <button onclick="openHistory()" class="w-10 h-10 rounded-full bg-slate-50 flex items-center justify-center text-slate-600 hover:bg-slate-100 transition shadow-sm border border-slate-100">
                    <i class="fa-solid fa-clock-rotate-left"></i>
                </button>
                <button onclick="window.open('dashboard.html', '_blank')" class="w-10 h-10 rounded-full bg-blue-50 flex items-center justify-center text-blue-600 hover:bg-blue-100 transition shadow-sm border border-blue-100">
                    <i class="fa-solid fa-chart-pie"></i>
                </button>
            </div>
        </div>

        <!-- MAIN CONTENT -->
        <div class="px-6 mt-6 space-y-8">
            <!-- 1. DATA PELANGGAN -->
            <div class="space-y-4">
                <h2 class="text-sm font-bold text-slate-400 uppercase tracking-wide">Data Pelanggan</h2>
                <!-- Input Nama -->
                <div class="relative group">
                    <div class="absolute left-4 top-3.5 text-slate-400"><i class="fa-regular fa-user"></i></div>
                    <input type="text" id="nama" autocomplete="off" class="input-premium w-full pl-12 pr-4 py-3.5 rounded-2xl font-medium text-slate-700 outline-none" placeholder="Nama Pelanggan">
                    <div id="autocomplete-list" class="absolute z-20 w-full mt-2 bg-white rounded-xl shadow-xl border border-slate-100 hidden max-h-48 overflow-y-auto custom-scroll"></div>
                </div>
                <!-- Input HP -->
                <div class="relative group">
                    <div class="absolute left-4 top-3.5 text-slate-400"><i class="fa-brands fa-whatsapp"></i></div>
                    <input type="tel" id="hp" class="input-premium w-full pl-12 pr-4 py-3.5 rounded-2xl font-medium text-slate-700 outline-none" placeholder="Nomor WhatsApp (812xxx)">
                </div>
            </div>

            <!-- 2. PILIH LAYANAN -->
            <div class="space-y-4">
                <div class="flex justify-between items-center">
                    <h2 class="text-sm font-bold text-slate-400 uppercase tracking-wide">Pilih Layanan</h2>
                    <button onclick="fetchServices()" class="text-xs text-blue-500 font-bold hover:text-blue-700"><i class="fa-solid fa-arrows-rotate mr-1"></i> Refresh</button>
                </div>
                <!-- Grid Layanan -->
                <div id="serviceGrid" class="grid grid-cols-2 gap-3">
                    <div class="h-24 bg-slate-100 rounded-2xl animate-pulse"></div>
                    <div class="h-24 bg-slate-100 rounded-2xl animate-pulse"></div>
                </div>
                <!-- Input Berat (Hidden by default) -->
                <div id="weightInputSection" class="hidden bg-white p-4 rounded-2xl border border-blue-100 shadow-sm space-y-3">
                    <div class="flex justify-between text-sm"><span class="text-slate-500">Layanan:</span><span class="font-bold text-slate-800" id="selectedServiceName">-</span></div>
                    <div class="flex gap-2">
                        <div class="relative flex-1">
                            <input type="text" inputmode="decimal" id="itemBerat" class="input-premium w-full pl-4 pr-12 py-3 rounded-xl font-bold text-lg text-slate-800 outline-none text-center" placeholder="0.0">
                            <span class="absolute right-4 top-3.5 text-slate-400 font-medium text-sm">Kg</span>
                        </div>
                        <button onclick="addToCart()" class="bg-blue-600 hover:bg-blue-700 text-white w-12 rounded-xl flex items-center justify-center transition active:scale-95 text-lg"><i class="fa-solid fa-plus"></i></button>
                    </div>
                </div>
            </div>

            <!-- 3. KERANJANG (CART) -->
            <div id="cartSection" class="hidden space-y-4 pb-4">
                <h2 class="text-sm font-bold text-slate-400 uppercase tracking-wide">Rincian Order</h2>
                <div class="bg-white rounded-2xl border border-slate-100 shadow-sm divide-y divide-slate-50" id="cartList"></div>
                
                <!-- Toggle Bayar -->
                <div class="bg-green-50 p-4 rounded-2xl border border-green-100 flex flex-col gap-3">
                    <div class="flex items-center justify-between">
                        <span class="text-sm font-bold text-green-800 flex items-center gap-2"><i class="fa-solid fa-wallet"></i> Bayar Lunas?</span>
                        <label class="relative inline-flex items-center cursor-pointer">
                            <input type="checkbox" id="chkBayarAwal" class="sr-only peer" onchange="toggleMetodeBayar()">
                            <div class="w-11 h-6 bg-green-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-green-600"></div>
                        </label>
                    </div>
                    <div id="divMetodeBayar" class="hidden">
                        <select id="selectMetodeBayar" class="w-full px-4 py-2 bg-white border border-green-200 rounded-xl text-sm font-medium text-green-800 focus:outline-none">
                            <option value="Tunai">💵 Tunai (Cash)</option>
                            <option value="QRIS/Transfer">📱 QRIS / Transfer</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <!-- FLOATING BOTTOM BAR -->
        <div class="fab-container">
            <div class="flex gap-4 items-center">
                <div class="flex-1">
                    <p class="text-xs text-slate-400 font-medium mb-0.5">Total Tagihan</p>
                    <h3 class="text-2xl font-bold text-slate-800" id="grandTotalDisplay">Rp 0</h3>
                </div>
                <button onclick="submitOrder()" id="btnSubmit" class="flex-1 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white py-3.5 rounded-xl font-bold shadow-lg shadow-blue-200 transition transform active:scale-95 flex justify-center items-center gap-2">
                    <span>Proses</span><i class="fa-solid fa-paper-plane text-xs"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- MODAL HISTORY -->
    <div id="historyModal" class="fixed inset-0 z-50 hidden">
        <div class="absolute inset-0 bg-black/60 backdrop-blur-sm transition-opacity" onclick="closeHistory()"></div>
        <div class="absolute bottom-0 left-0 right-0 bg-white rounded-t-3xl h-[85vh] flex flex-col transform transition-transform duration-300 translate-y-0 shadow-2xl md:max-w-[480px] md:mx-auto">
            <div class="w-full flex justify-center pt-3 pb-1" onclick="closeHistory()"><div class="w-12 h-1.5 bg-slate-200 rounded-full"></div></div>
            <div class="px-6 py-4 border-b border-slate-50 flex justify-between items-center">
                <h2 class="text-lg font-bold text-slate-800">Riwayat & Update</h2>
                <button onclick="closeHistory()" class="w-8 h-8 rounded-full bg-slate-50 flex items-center justify-center text-slate-400 hover:bg-red-50 hover:text-red-500 transition"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="flex-1 overflow-y-auto px-4 py-4 custom-scroll" id="historyContent">
                <div class="flex flex-col items-center justify-center h-48 text-slate-400"><i class="fa-solid fa-spinner fa-spin text-2xl mb-2"></i><p class="text-sm">Memuat data...</p></div>
            </div>
        </div>
    </div>

    <!-- BOTTOM SHEET UPDATE -->
    <div id="updateSheet" class="fixed inset-0 z-[60] hidden">
        <div class="absolute inset-0 bg-black/60 backdrop-blur-sm transition-opacity" onclick="closeUpdateSheet()"></div>
        <div class="absolute bottom-0 left-0 right-0 bg-white rounded-t-3xl p-6 flex flex-col gap-4 shadow-2xl md:max-w-[480px] md:mx-auto transform transition-transform duration-300 animate-slide-up">
            <div class="w-12 h-1.5 bg-slate-200 rounded-full mx-auto mb-2"></div>
            
            <div id="sheetContent">
                <div class="text-center mb-4">
                    <h3 class="text-lg font-bold text-slate-800">Update Status</h3>
                    <p class="text-sm text-slate-500">Pelanggan: <span id="updateCustomerName" class="font-bold text-blue-600"></span></p>
                </div>

                <!-- Status Options -->
                <div id="statusOptions" class="flex flex-col gap-3">
                    <button onclick="processUpdate('Dikerjakan')" class="w-full py-4 bg-yellow-50 text-yellow-700 font-bold rounded-2xl border border-yellow-100 flex items-center justify-center gap-3 active:scale-95 transition">
                        <i class="fa-solid fa-hourglass-half text-lg"></i> Dikerjakan
                    </button>
                    <button onclick="processUpdate('Selesai')" class="w-full py-4 bg-green-50 text-green-700 font-bold rounded-2xl border border-green-100 flex items-center justify-center gap-3 active:scale-95 transition">
                        <i class="fa-solid fa-check-circle text-lg"></i> Selesai
                    </button>
                    <button onclick="checkPaymentFirst()" class="w-full py-4 bg-slate-100 text-slate-700 font-bold rounded-2xl border border-slate-200 flex items-center justify-center gap-3 active:scale-95 transition">
                        <i class="fa-solid fa-hand-holding-hand text-lg"></i> Diambil
                    </button>
                </div>

                <!-- Payment Form -->
                <div id="paymentSettle" class="hidden flex flex-col gap-4">
                    <div class="bg-red-50 p-5 rounded-2xl border border-red-100 text-center">
                        <p class="text-xs font-bold text-red-500 uppercase tracking-wide">⚠️ Tagihan Belum Lunas</p>
                        <h2 class="text-3xl font-bold text-red-700 mt-2" id="settleAmount">Rp 0</h2>
                    </div>
                    <div>
                        <label class="text-xs font-bold text-slate-400 uppercase ml-1">Metode Pembayaran</label>
                        <select id="settleMethod" class="w-full mt-1 px-4 py-3 bg-white border border-slate-200 rounded-xl text-slate-700 font-medium focus:outline-none focus:border-blue-500">
                            <option value="Tunai">💵 Tunai (Cash)</option>
                            <option value="QRIS/Transfer">📱 QRIS / Transfer</option>
                        </select>
                    </div>
                    <div class="flex gap-3 mt-2">
                        <button onclick="toggleSettleView(false)" class="flex-1 py-3 bg-white border border-slate-200 text-slate-500 font-bold rounded-xl">Batal</button>
                        <button onclick="processUpdate('Diambil', true)" class="flex-[2] py-3 bg-blue-600 text-white font-bold rounded-xl shadow-lg shadow-blue-200">Bayar & Ambil</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- TOAST -->
    <div id="toast" class="fixed top-4 left-1/2 transform -translate-x-1/2 bg-slate-800 text-white px-6 py-3 rounded-full shadow-xl z-[70] transition-all duration-300 translate-y-[-100px] opacity-0 flex items-center gap-3 pointer-events-none">
        <i class="fa-solid fa-circle-check text-green-400"></i><span class="text-sm font-medium" id="toastMsg">Berhasil!</span>
    </div>
</body>
</html>
