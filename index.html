<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS Laundry</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .loader { border: 3px solid #e5e7eb; border-radius: 50%; border-top: 3px solid #3b82f6; width: 20px; height: 20px; animation: spin 1s linear infinite; }
        .loader-lg { width: 40px; height: 40px; border-width: 4px; border-top-width: 4px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: #f1f1f1; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 4px; }
        
        .autocomplete-items { position: absolute; border: 1px solid #d4d4d4; border-bottom: none; border-top: none; z-index: 99; top: 100%; left: 0; right: 0; background-color: white; border-radius: 0 0 8px 8px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); max-height: 200px; overflow-y: auto; }
        .autocomplete-items div { padding: 10px; cursor: pointer; background-color: #fff; border-bottom: 1px solid #d4d4d4; font-size: 14px; }
        .autocomplete-items div:hover { background-color: #e9e9e9; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- Container Aplikasi Utama -->
    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl overflow-hidden relative z-10">
        
        <!-- Header -->
        <div class="bg-blue-600 p-6 text-white text-center">
            <h1 class="text-2xl font-bold">🧺 Laundry POS</h1>
            <p class="text-blue-100 text-sm opacity-90">Aplikasi Kasir Hemat</p>
        </div>

        <div class="p-6 space-y-6">

            <!-- Form Data Pelanggan -->
            <div class="space-y-4">
                <div class="relative">
                    <label class="block text-gray-700 text-sm font-semibold mb-1">Nama Pelanggan</label>
                    <input type="text" id="nama" autocomplete="off" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none transition" placeholder="Cari / Ketik nama..." required>
                    <!-- Container Autocomplete -->
                    <div id="autocomplete-list" class="autocomplete-items hidden shadow-lg rounded-b-lg"></div>
                </div>

                <div>
                    <label class="block text-gray-700 text-sm font-semibold mb-1">WhatsApp</label>
                    <div class="flex">
                        <span class="inline-flex items-center px-3 rounded-l-lg border border-r-0 border-gray-300 bg-gray-50 text-gray-500 text-sm font-bold">+62</span>
                        <input type="tel" id="hp" class="w-full px-4 py-2 border border-gray-300 rounded-r-lg focus:ring-2 focus:ring-blue-500 focus:outline-none transition" placeholder="8123456789" required>
                    </div>
                </div>
            </div>

            <hr class="border-gray-100">

            <!-- Keranjang Belanja -->
            <div class="bg-blue-50 p-4 rounded-xl border border-blue-100 space-y-3">
                <div class="flex justify-between items-center">
                    <h3 class="text-sm font-bold text-blue-800 flex items-center gap-2">🛒 Tambah Item</h3>
                    <!-- Tombol Refresh Produk -->
                    <button onclick="fetchServices()" title="Refresh Daftar Harga" class="text-xs text-blue-500 underline hover:text-blue-700">🔄 Refresh Harga</button>
                </div>
                
                <div>
                    <!-- Dropdown Layanan -->
                    <select id="serviceSelect" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none text-sm bg-white cursor-pointer" onchange="updatePriceDisplay()">
                        <option value="">-- Memuat Produk... --</option>
                    </select>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <input type="text" inputmode="decimal" id="itemBerat" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none text-sm text-center" placeholder="Berat (Kg/Pcs)">
                    </div>
                    <div>
                        <input type="text" id="displayHarga" class="w-full px-3 py-2 border border-gray-200 bg-gray-100 rounded-lg text-sm text-gray-500 text-center" disabled>
                    </div>
                </div>
                <button onclick="addToCart()" class="w-full bg-blue-600 hover:bg-blue-700 text-white text-sm font-bold py-2 px-4 rounded-lg transition duration-200 flex justify-center items-center gap-1 shadow-sm active:scale-95">
                    <span>+ Masukkan Keranjang</span>
                </button>
            </div>

            <!-- Tabel Cart -->
            <div id="cartSection" class="hidden">
                <div class="border border-gray-200 rounded-lg overflow-hidden">
                    <table class="w-full text-sm text-left">
                        <thead class="bg-gray-50 text-gray-500 text-xs uppercase">
                            <tr>
                                <th class="px-3 py-2">Layanan</th>
                                <th class="px-3 py-2 text-right">Subtotal</th>
                                <th class="px-3 py-2"></th>
                            </tr>
                        </thead>
                        <tbody id="cartTableBody" class="divide-y divide-gray-100 bg-white"></tbody>
                    </table>
                    <div class="bg-gray-50 px-3 py-3 flex justify-between items-center border-t border-gray-200">
                        <span class="font-bold text-gray-700 text-xs uppercase">Total Bayar</span>
                        <span class="font-bold text-blue-600 text-lg" id="grandTotalDisplay">Rp 0</span>
                    </div>
                </div>
            </div>

            <!-- Submit Button -->
            <button onclick="submitOrder()" id="btnSubmit" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-lg shadow-lg transition duration-200 flex justify-center items-center gap-2 transform active:scale-95">
                <span>🚀 Proses & Kirim Nota</span>
            </button>
            
            <div id="statusMessage" class="hidden text-center text-sm p-2 rounded animate-pulse"></div>

            <button onclick="loadHistory()" class="w-full text-blue-600 text-sm font-semibold hover:text-blue-800 transition mt-2 flex items-center justify-center gap-2 py-2">
                📂 Riwayat & Update Status
            </button>
        </div>
    </div>

    <!-- MODAL HISTORY -->
    <div id="historyModal" class="fixed inset-0 bg-black bg-opacity-70 hidden flex items-center justify-center p-4 z-50 transition-opacity duration-300 backdrop-blur-sm">
        <div class="bg-white w-full max-w-3xl rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[85vh]">
            <div class="p-4 border-b border-gray-100 flex justify-between items-center bg-blue-50">
                <div class="flex items-center gap-2"><span class="text-2xl">📂</span><h2 class="font-bold text-lg text-blue-800">Database Transaksi</h2></div>
                <button onclick="closeHistory()" class="text-gray-400 hover:text-red-500 text-2xl font-bold">&times;</button>
            </div>
            <div class="overflow-y-auto p-0 flex-1 custom-scroll bg-gray-50 relative">
                <!-- Overlay Update Status -->
                <div id="updateOverlay" class="hidden absolute inset-0 bg-white bg-opacity-95 z-20 flex flex-col items-center justify-center p-6 text-center">
                    <h3 class="text-lg font-bold text-gray-800 mb-2">Update Status</h3>
                    <p class="text-sm text-gray-500 mb-6">Pelanggan: <span id="updateCustName" class="font-semibold text-blue-600"></span></p>
                    <div class="space-y-3 w-full max-w-xs">
                        <button onclick="processUpdate('Dikerjakan')" class="w-full py-3 px-4 bg-yellow-100 hover:bg-yellow-200 text-yellow-800 font-semibold rounded-lg border border-yellow-300">🟡 Dikerjakan</button>
                        <button onclick="processUpdate('Selesai')" class="w-full py-3 px-4 bg-green-100 hover:bg-green-200 text-green-800 font-semibold rounded-lg border border-green-300">✅ Selesai</button>
                        <button onclick="processUpdate('Diambil')" class="w-full py-3 px-4 bg-gray-100 hover:bg-gray-200 text-gray-800 font-semibold rounded-lg border border-gray-300">👋 Diambil</button>
                    </div>
                    <button onclick="closeUpdateOverlay()" class="mt-8 text-gray-400 text-sm underline">Batalkan</button>
                </div>
                
                <div id="historyLoading" class="hidden flex flex-col items-center justify-center py-12 text-gray-500"><div class="loader loader-lg mb-3"></div><p>Mengambil Data...</p></div>
                <div id="historyEmpty" class="hidden flex flex-col items-center justify-center py-12 text-gray-400"><p>Belum ada data transaksi.</p></div>
                
                <table class="w-full text-sm text-left bg-white hidden" id="dataTable">
                    <thead class="text-xs text-gray-500 uppercase bg-gray-100 border-b border-gray-200 sticky top-0 shadow-sm z-10">
                        <tr><th class="px-4 py-3">Tgl</th><th class="px-4 py-3">Pelanggan</th><th class="px-4 py-3 text-center">Status</th><th class="px-4 py-3 text-right">Total</th></tr>
                    </thead>
                    <tbody id="historyTableBody" class="divide-y divide-gray-100"></tbody>
                </table>
            </div>
            <div class="p-4 border-t border-gray-100 bg-white text-xs text-gray-400 flex justify-between">
                <span id="recordCount">0 Data</span>
                <span>*Klik status untuk mengubah</span>
            </div>
        </div>
    </div>

    <script>
        // --- KONFIGURASI PENTING (DIISI SEBELUM DEPLOY) ---
        // Masukkan URL Google Apps Script (/exec) milik klien di sini:
        const APP_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxeorSmtjsep3vx4rfYO_bYWPMAOp0JxMVeMFR3FnOnSCnBc7zkTp1bxGr2qOqY2mpNlA/exec"; 

        // --- VARIABLE GLOBAL ---
        let products = []; // Produk akan diisi dari Google Sheet
        let cart = [];
        let customerDatabase = [];

        // --- INIT SAAT WEB DIBUKA ---
        window.onload = () => {
            if (!APP_SCRIPT_URL) {
                alert("PENTING: Variabel APP_SCRIPT_URL di dalam file index.html belum diisi! Silakan edit file dan masukkan URL Google Apps Script.");
                return;
            }
            
            // Load data parallel biar cepet
            fetchCustomers(); 
            fetchServices(); 
        };

        // --- FETCH PRODUK DARI SHEET (TAB SETTING) ---
        async function fetchServices() {
            const select = document.getElementById('serviceSelect');
            
            if (!APP_SCRIPT_URL) {
                select.innerHTML = "<option>Error: URL Belum Diset</option>";
                return;
            }

            select.innerHTML = "<option>Loading Produk...</option>";

            try {
                // Request dengan parameter action=products
                const response = await fetch(`${APP_SCRIPT_URL}?action=products`);
                const data = await response.json();
                
                products = data; // Simpan ke global variable
                
                // Render ke Dropdown
                select.innerHTML = "";
                if(products.length === 0) {
                     select.innerHTML = "<option value=''>Data Produk Kosong</option>";
                     return;
                }

                products.forEach(p => {
                    const opt = document.createElement('option');
                    opt.value = p.id;
                    opt.text = `${p.name}`;
                    select.appendChild(opt);
                });
                
                updatePriceDisplay(); // Update harga item pertama
                
            } catch (error) {
                console.error("Gagal ambil produk:", error);
                select.innerHTML = "<option>Gagal Load Produk</option>";
                alert("Gagal mengambil daftar harga. Pastikan Tab 'Setting' sudah dibuat di Google Sheet.");
            }
        }

        // --- FUNGSI UTILITAS ---

        function updatePriceDisplay() {
            const id = document.getElementById('serviceSelect').value;
            const product = products.find(p => p.id == id);
            
            if(product) {
                document.getElementById('displayHarga').value = `Rp ${parseInt(product.price).toLocaleString('id-ID')}`;
            } else {
                document.getElementById('displayHarga').value = "-";
            }
        }

        // FUNGSI PINTAR: Parsing angka, terima titik (.) atau koma (,)
        function parseLocalFloat(numStr) { 
            if (!numStr) return 0; 
            // Ubah koma jadi titik biar JS ngerti, baru diparsing
            return parseFloat(numStr.toString().replace(',', '.')) || 0; 
        }

        // FUNGSI PINTAR: Format tampilan ke Indonesia (Koma untuk desimal)
        function formatDecimal(num) {
            return num.toLocaleString('id-ID', { maximumFractionDigits: 2 });
        }

        // --- CART LOGIC ---
        function addToCart() {
            const beratInput = document.getElementById('itemBerat');
            // Parse angka (Titik atau Koma masuk semua)
            const berat = parseLocalFloat(beratInput.value);
            
            if (berat <= 0) return alert("Jumlah/Berat harus diisi!");
            
            const serviceId = document.getElementById('serviceSelect').value;
            const product = products.find(p => p.id == serviceId);
            
            if(!product) return alert("Pilih produk dulu!");

            cart.push({ name: product.name, price: product.price, weight: berat, subtotal: berat * product.price });
            beratInput.value = ""; 
            renderCart();
        }

        function deleteItem(index) { 
            cart.splice(index, 1); 
            renderCart(); 
        }

        function renderCart() {
            const tbody = document.getElementById('cartTableBody');
            const cartSection = document.getElementById('cartSection');
            const grandTotalDisplay = document.getElementById('grandTotalDisplay');
            
            tbody.innerHTML = "";
            if (cart.length === 0) { cartSection.classList.add('hidden'); return; }
            cartSection.classList.remove('hidden');
            
            let grandTotal = 0;
            cart.forEach((item, index) => {
                grandTotal += item.subtotal;
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="px-3 py-2">
                        <div class="font-medium text-gray-800">${item.name}</div>
                        <div class="text-xs text-gray-400">@ ${item.price/1000}k</div>
                    </td>
                    <td class="px-3 py-2 text-right font-medium text-gray-600">
                        ${formatDecimal(item.weight)} kg
                    </td>
                    <td class="px-3 py-2 text-right font-medium">Rp ${item.subtotal.toLocaleString('id-ID')}</td>
                    <td class="px-3 py-2 text-right">
                        <button onclick="deleteItem(${index})" class="text-red-400 hover:text-red-600 font-bold">&times;</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
            grandTotalDisplay.innerText = "Rp " + grandTotal.toLocaleString('id-ID');
        }

        // --- DATABASE PELANGGAN ---
        async function fetchCustomers() {
            if (!APP_SCRIPT_URL) return;
            try {
                // Default fetch adalah history transaksi, kita bisa ambil data pelanggan dari sana
                const res = await fetch(APP_SCRIPT_URL); 
                const data = await res.json();
                const uniqueCust = new Map();
                data.forEach(row => { if (row.nama && row.hp) uniqueCust.set(row.nama.toLowerCase().trim(), { nama: row.nama, hp: row.hp }); });
                customerDatabase = Array.from(uniqueCust.values());
            } catch (e) {}
        }

        // --- AUTOCOMPLETE PELANGGAN ---
        const namaInput = document.getElementById("nama");
        const listDiv = document.getElementById("autocomplete-list");
        namaInput.addEventListener("input", function(e) {
            const val = this.value; 
            listDiv.innerHTML = ""; listDiv.classList.add("hidden");
            if (!val) return;
            
            listDiv.classList.remove("hidden");
            let count = 0;
            customerDatabase.forEach(cust => {
                if (cust.nama.substr(0, val.length).toUpperCase() == val.toUpperCase()) {
                    if (count > 5) return;
                    const item = document.createElement("div");
                    item.innerHTML = "<strong>" + cust.nama.substr(0, val.length) + "</strong>" + cust.nama.substr(val.length) + ` <span class='text-gray-400 text-xs ml-2'>(${cust.hp})</span>`;
                    item.addEventListener("click", function() { 
                        namaInput.value = cust.nama; 
                        document.getElementById("hp").value = cust.hp.toString().replace(/^62/, '').replace(/^0/, ''); 
                        listDiv.innerHTML = ""; listDiv.classList.add("hidden"); 
                    });
                    listDiv.appendChild(item); count++;
                }
            });
        });
        document.addEventListener("click", function (e) { if (e.target !== namaInput) { listDiv.innerHTML = ""; listDiv.classList.add("hidden"); }});

        // --- SUBMIT ORDER ---
        async function submitOrder() {
            if (!APP_SCRIPT_URL) return alert("URL Database Toko belum diisi di kode!");
            if (cart.length === 0) return alert("Keranjang kosong!");
            
            const nama = document.getElementById('nama').value; if(!nama) return alert("Nama wajib diisi");
            let hp = document.getElementById('hp').value.replace(/\D/g, '').replace(/^0/, '').replace(/^62/, '');
            const hpFull = "62" + hp;
            
            const totalWeight = cart.reduce((sum, item) => sum + item.weight, 0);
            const totalPrice = cart.reduce((sum, item) => sum + item.subtotal, 0);
            
            const btn = document.getElementById('btnSubmit'); 
            const statusDiv = document.getElementById('statusMessage');
            
            btn.disabled = true; 
            btn.innerHTML = `<div class="loader"></div> Menyimpan...`;
            
            // Format WA (Pakai formatDecimal biar Koma muncul di WA)
            let itemsString = cart.map(item => `• ${item.name} (${formatDecimal(item.weight)}kg): Rp ${item.subtotal.toLocaleString('id-ID')}`).join('\n');
            const pesanWA = `*NOTA LAUNDRY*\n\nHalo Kak *${nama}*,\nBerikut rincian cucian kakak:\n\n${itemsString}\n\n *Total: Rp ${totalPrice.toLocaleString('id-ID')}*\n Total Berat: ${formatDecimal(totalWeight)} kg\n Status: *Dikerjakan*\n\nTerima kasih!`;
            
            try {
                await fetch(APP_SCRIPT_URL, { 
                    method: 'POST', mode: 'no-cors', 
                    headers: { 'Content-Type': 'application/json' }, 
                    body: JSON.stringify({ nama, hp: hpFull, berat: totalWeight, harga: totalPrice, status: "Dikerjakan" }) 
                });
                
                statusDiv.innerText = "✅ Tersimpan!"; 
                statusDiv.classList.remove('hidden'); 
                statusDiv.className = "block bg-green-100 text-green-700 p-2 rounded text-center text-sm mb-2";
                
                setTimeout(() => { 
                    window.open(`https://wa.me/${hpFull}?text=${encodeURIComponent(pesanWA)}`, '_blank'); 
                    cart = []; renderCart(); 
                    document.getElementById('nama').value = ""; 
                    document.getElementById('hp').value = ""; 
                    btn.disabled = false; 
                    btn.innerHTML = `<span>🚀 Proses & Kirim Nota</span>`; 
                    fetchCustomers(); 
                    setTimeout(() => statusDiv.classList.add('hidden'), 3000); 
                }, 1000);
            } catch (error) { 
                console.error(error); btn.disabled = false; alert("Gagal menyimpan."); 
            }
        }

        // --- HISTORY & UPDATE STATUS ---
        let selectedRowData = null;
        async function loadHistory() {
            if (!APP_SCRIPT_URL) return alert("URL Database belum diisi di kode!");
            
            const els = { modal: document.getElementById('historyModal'), tbody: document.getElementById('historyTableBody'), table: document.getElementById('dataTable'), loading: document.getElementById('historyLoading'), empty: document.getElementById('historyEmpty') };
            
            els.modal.classList.remove('hidden'); 
            els.loading.classList.remove('hidden'); 
            els.table.classList.add('hidden'); 
            els.empty.classList.add('hidden'); 
            els.tbody.innerHTML = '';
            
            try {
                const res = await fetch(APP_SCRIPT_URL); 
                const data = await res.json(); 
                els.loading.classList.add('hidden');
                
                if (!data || data.length === 0) { els.empty.classList.remove('hidden'); return; }
                
                els.table.classList.remove('hidden'); 
                document.getElementById('recordCount').innerText = `${data.length} Data`;
                
                data.slice().reverse().forEach(row => {
                    const tr = document.createElement('tr');
                    let displayDate = row.tanggal; try { displayDate = new Date(row.tanggal).toLocaleDateString('id-ID', {day:'numeric', month:'short'}); } catch(e){}
                    
                    const statusText = row.status || 'Dikerjakan';
                    let badgeColor = "bg-yellow-100 text-yellow-800"; 
                    if (statusText.includes("Selesai")) badgeColor = "bg-green-100 text-green-800"; 
                    if (statusText.includes("Diambil")) badgeColor = "bg-gray-100 text-gray-800";
                    
                    const rowJson = JSON.stringify(row).replace(/"/g, '&quot;');
                    
                    tr.innerHTML = `
                        <td class="px-4 py-3 whitespace-nowrap text-gray-500">${displayDate}</td>
                        <td class="px-4 py-3"><div class="font-bold text-gray-800 capitalize">${row.nama}</div></td>
                        <td class="px-4 py-3 text-center"><button onclick="openUpdateOverlay(${rowJson})" class="px-2 py-1 rounded text-xs font-bold border ${badgeColor}">${statusText}</button></td>
                        <td class="px-4 py-3 text-right text-blue-600 font-bold">Rp ${(parseInt(row.harga)||0).toLocaleString('id-ID')}</td>
                    `;
                    els.tbody.appendChild(tr);
                });
            } catch (error) { 
                els.loading.classList.add('hidden'); alert("Gagal load history."); closeHistory(); 
            }
        }

        function closeHistory() { document.getElementById('historyModal').classList.add('hidden'); closeUpdateOverlay(); }
        function openUpdateOverlay(rowData) { selectedRowData = rowData; document.getElementById('updateCustName').innerText = rowData.nama; document.getElementById('updateOverlay').classList.remove('hidden'); }
        function closeUpdateOverlay() { document.getElementById('updateOverlay').classList.add('hidden'); selectedRowData = null; }
        
        async function processUpdate(newStatus) {
            if (!selectedRowData) return;
            if (!APP_SCRIPT_URL) return;
            const overlay = document.getElementById('updateOverlay'); 
            overlay.innerHTML = `<div class="flex flex-col items-center gap-2"><div class="loader loader-lg"></div><p>Menghubungkan...</p></div>`;
            
            try {
                await fetch(APP_SCRIPT_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'update', rowNumber: selectedRowData.rowNumber, status: newStatus }) });
                
                const hp = "62" + selectedRowData.hp.toString().replace(/^0/, '').replace(/^62/, '');
                let pesanWA = `Status Laundry ${selectedRowData.nama}: ${newStatus}`;
                if(newStatus === "Selesai") pesanWA = `Laundry Selesai!\n\nHalo ${selectedRowData.nama}, laundry sudah beres. Total: Rp ${(parseInt(selectedRowData.harga)||0).toLocaleString('id-ID')}`;
                
                setTimeout(() => { 
                    window.open(`https://wa.me/${hp}?text=${encodeURIComponent(pesanWA)}`, '_blank'); 
                    closeUpdateOverlay(); 
                    loadHistory(); 
                }, 1500);
            } catch(e) { 
                alert("Gagal update"); closeUpdateOverlay(); 
            }
        }

        // --- FITUR KEAMANAN (ANTI KLIK KANAN & INSPECT) ---
        
        // 1. Matikan Klik Kanan
        document.addEventListener('contextmenu', event => event.preventDefault());

        // 2. Matikan Shortcut Inspect Element (F12, Ctrl+Shift+I, dll)
        document.onkeydown = function(e) {
            if(e.keyCode == 123) { return false; } // F12
            if(e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) { return false; } // Ctrl+Shift+I
            if(e.ctrlKey && e.shiftKey && e.keyCode == 'C'.charCodeAt(0)) { return false; } // Ctrl+Shift+C
            if(e.ctrlKey && e.shiftKey && e.keyCode == 'J'.charCodeAt(0)) { return false; } // Ctrl+Shift+J
            if(e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) { return false; } // Ctrl+U
        }
    </script>
</body>
</html>
